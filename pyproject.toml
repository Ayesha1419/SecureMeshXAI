[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "securemeshxai"
version = "1.0.0"
description = "Reproducible temporal-graph IoT intrusion detection, trust estimation and response evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.1", "matplotlib>=3.7", "PyYAML>=6.0", "joblib>=1.3"]
[project.optional-dependencies]
xai = ["shap>=0.44", "lime>=0.2.0.1"]
boosting = ["xgboost>=2.0"]
optim = ["optuna>=3.4"]
test = ["pytest>=7.4"]
pyg = ["torch-geometric>=2.4"]
all = ["shap>=0.44", "lime>=0.2.0.1", "xgboost>=2.0", "optuna>=3.4", "pytest>=7.4"]
[project.scripts]
securemeshxai = "securemeshxai.cli:main"
[tool.setuptools.packages.find]
where=["src"]
